<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0a0d1a"/>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1d66a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a07c10"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Copa cuerpo -->
  <path d="M176 96h160v140c0 55-36 100-80 115-44-15-80-60-80-115V96z" fill="url(#gold)"/>
  <!-- Brillo copa -->
  <path d="M176 96h160v140c0 55-36 100-80 115-44-15-80-60-80-115V96z" fill="url(#shine)"/>
  <!-- Asas izquierda -->
  <path d="M176 120c0 0-56 0-56 56s40 72 56 72" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <!-- Asas derecha -->
  <path d="M336 120c0 0 56 0 56 56s-40 72-56 72" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <!-- Pedestal cuello -->
  <rect x="228" y="351" width="56" height="44" rx="4" fill="url(#gold)"/>
  <!-- Base pedestal -->
  <rect x="176" y="390" width="160" height="28" rx="10" fill="url(#gold)"/>
  <!-- Línea horizontal base -->
  <rect x="156" y="414" width="200" height="14" rx="7" fill="#d4af37" opacity="0.7"/>
  <!-- Estrella central copa -->
  <text x="256" y="268" text-anchor="middle" font-size="68" font-family="serif" fill="#0a0d1a" opacity="0.45">★</text>
</svg>
