<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // Toma la ruta actual (/mexico, /bracket, etc.) y redirige a index.html
    // pasando la ruta en el hash para que el router la procese
    var path = window.location.pathname;
    window.location.replace('/#' + path);
  </script>
</head>
<body></body>
</html>
