<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit de Marketing — Álbum 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --panel2: #1a2236;
      --border: #2a3550;
      --accent: #6633cc;
      --accent2: #00a9bd;
      --gold: #d4af37;
      --text: #e8ecf5;
      --muted: #6b7a99;
      --red: #c8102e;
      --green: #00843d;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

    /* ── Layout ── */
    .app { display: flex; height: 100dvh; overflow: hidden; }

    .sidebar {
      width: 340px;
      min-width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--panel2);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .sidebar-header h1 { font-size: 16px; font-weight: 700; color: var(--gold); letter-spacing: .5px; }
    .sidebar-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #070a12;
      gap: 16px;
      padding: 24px;
      overflow: auto;
    }

    /* ── Sections ── */
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Controls ── */
    label { display: block; color: #9aa5c0; font-size: 12px; margin-bottom: 4px; margin-top: 8px; }
    label:first-child { margin-top: 0; }

    input[type="text"], input[type="url"], select, textarea {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus, input[type="url"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 56px; font-family: inherit; line-height: 1.4; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="color"] {
      width: 36px; height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel2);
      cursor: pointer;
      padding: 2px;
    }

    .row { display: flex; align-items: center; gap: 8px; }
    .row label { margin: 0; white-space: nowrap; min-width: 60px; }
    .row input[type="range"] { flex: 1; }
    .row input[type="text"], .row input[type="url"] { flex: 1; }

    /* ── Format buttons ── */
    .format-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .fmt-btn {
      padding: 8px 6px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      line-height: 1.4;
      transition: border-color .2s, background .2s;
    }
    .fmt-btn .fmt-icon { font-size: 18px; display: block; margin-bottom: 2px; }
    .fmt-btn.active { border-color: var(--accent); background: rgba(102,51,204,.18); color: #fff; }
    .fmt-btn:hover:not(.active) { border-color: #4a5a7a; }

    /* ── BG presets ── */
    .bg-presets {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
    }
    .bg-swatch {
      width: 32px; height: 32px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .15s, transform .15s;
    }
    .bg-swatch:hover { transform: scale(1.12); }
    .bg-swatch.active { border-color: #fff; }

    /* ── Upload areas ── */
    .upload-area {
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .upload-area:hover { border-color: var(--accent); background: rgba(102,51,204,.07); }
    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-area .upload-icon { font-size: 20px; display: block; margin-bottom: 4px; }
    .upload-name { font-size: 11px; color: var(--accent2); margin-top: 4px; word-break: break-all; }

    /* ── Overlay slider ── */
    .overlay-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .overlay-row label { margin: 0; min-width: 80px; font-size: 11px; color: var(--muted); }
    .overlay-row span { font-size: 11px; color: var(--muted); min-width: 28px; text-align: right; }

    /* ── Font controls ── */
    .text-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .text-controls .full { grid-column: 1 / -1; }

    /* ── Canvas preview ── */
    #canvas-wrap {
      position: relative;
      box-shadow: 0 8px 48px rgba(0,0,0,.7);
      border-radius: 4px;
      overflow: hidden;
      max-width: 100%;
      max-height: calc(100dvh - 120px);
    }
    #canvas-preview {
      display: block;
      max-width: 100%;
      max-height: calc(100dvh - 120px);
      object-fit: contain;
    }

    .preview-size {
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Buttons ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.98); }
    .btn-download { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .btn-share { background: linear-gradient(135deg, #25d366, #128c52); color: #fff; }
    .btn-reset { background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }

    .btn-group { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }

    /* ── Font selector ── */
    select option { background: #1a2236; color: #e8ecf5; }

    /* ── Toggle ── */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .toggle {
      position: relative; width: 36px; height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; background: var(--border);
      border-radius: 20px; cursor: pointer; transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 14px; height: 14px;
      left: 3px; top: 3px; background: #fff;
      border-radius: 50%; transition: transform .2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .app { flex-direction: column; height: auto; overflow: auto; }
      .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid var(--border); overflow-y: visible; }
      .preview-pane { min-height: 60vw; padding: 16px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ─────────────────── SIDEBAR ─────────────────── -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>⚽ Kit de Marketing 2026</h1>
      <p>Crea imágenes listas para publicar en redes</p>
    </div>

    <!-- Formato -->
    <div class="section">
      <div class="section-title">Formato</div>
      <div class="format-grid">
        <button class="fmt-btn active" data-w="1080" data-h="1080">
          <span class="fmt-icon">⬛</span>Post cuadrado<br><small>1080 × 1080</small>
        </button>
        <button class="fmt-btn" data-w="1080" data-h="1920">
          <span class="fmt-icon">📱</span>Historia<br><small>1080 × 1920</small>
        </button>
        <button class="fmt-btn" data-w="1200" data-h="630">
          <span class="fmt-icon">🖼️</span>Banner<br><small>1200 × 630</small>
        </button>
        <button class="fmt-btn" data-w="1200" data-h="675">
          <span class="fmt-icon">🐦</span>Twitter / X<br><small>1200 × 675</small>
        </button>
      </div>
    </div>

    <!-- Fondo -->
    <div class="section">
      <div class="section-title">Fondo</div>
      <div class="bg-presets" id="bg-presets"></div>
      <label>Subir imagen de fondo</label>
      <div class="upload-area" id="bg-upload-area">
        <input type="file" id="bg-file" accept="image/*">
        <span class="upload-icon">🖼️</span>
        Haz clic o arrastra una imagen
        <div class="upload-name" id="bg-file-name"></div>
      </div>
      <div class="overlay-row" id="overlay-row" style="display:none">
        <label>Oscurecer</label>
        <input type="range" id="bg-overlay" min="0" max="90" value="40">
        <span id="bg-overlay-val">40%</span>
      </div>
    </div>

    <!-- Imagen principal -->
    <div class="section">
      <div class="section-title">Imagen principal</div>
      <div class="upload-area">
        <input type="file" id="main-file" accept="image/*">
        <span class="upload-icon">📸</span>
        Subir imagen principal
        <div class="upload-name" id="main-file-name"></div>
      </div>
      <label>O pegar URL de imagen</label>
      <div class="row">
        <input type="url" id="main-url" placeholder="https://...">
        <button id="main-url-btn" style="padding:8px 10px;background:var(--accent);border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:12px;white-space:nowrap">Cargar</button>
      </div>
      <label style="margin-top:10px">Tamaño <span id="main-scale-val">70%</span></label>
      <input type="range" id="main-scale" min="10" max="100" value="70">
      <label>Posición vertical <span id="main-y-val">Centro</span></label>
      <input type="range" id="main-y" min="0" max="100" value="50">
    </div>

    <!-- Texto arriba -->
    <div class="section">
      <div class="section-title">Texto arriba</div>
      <textarea id="text-top" placeholder="Texto que aparece arriba..."></textarea>
      <div class="text-controls">
        <div>
          <label>Tamaño</label>
          <input type="range" id="top-size" min="16" max="200" value="72">
          <small id="top-size-val" style="color:var(--muted)">72px</small>
        </div>
        <div>
          <label>Color</label>
          <div class="row">
            <input type="color" id="top-color" value="#ffffff">
            <input type="color" id="top-shadow-color" value="#000000" title="Sombra">
          </div>
          <small style="color:var(--muted)">Texto · Sombra</small>
        </div>
        <div class="full">
          <label>Fuente</label>
          <select id="top-font">
            <option value="Impact, Arial Black, sans-serif">Impact</option>
            <option value="'Arial Black', sans-serif">Arial Black</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Verdana, sans-serif">Verdana</option>
          </select>
        </div>
        <div class="full">
          <label>Posición vertical (arriba)</label>
          <input type="range" id="top-pos" min="0" max="50" value="8">
          <small id="top-pos-val" style="color:var(--muted)">8%</small>
        </div>
      </div>
    </div>

    <!-- Texto abajo -->
    <div class="section">
      <div class="section-title">Texto abajo</div>
      <textarea id="text-bottom" placeholder="Texto que aparece abajo..."></textarea>
      <div class="text-controls">
        <div>
          <label>Tamaño</label>
          <input type="range" id="bot-size" min="16" max="200" value="56">
          <small id="bot-size-val" style="color:var(--muted)">56px</small>
        </div>
        <div>
          <label>Color</label>
          <div class="row">
            <input type="color" id="bot-color" value="#ffffff">
            <input type="color" id="bot-shadow-color" value="#000000" title="Sombra">
          </div>
          <small style="color:var(--muted)">Texto · Sombra</small>
        </div>
        <div class="full">
          <label>Fuente</label>
          <select id="bot-font">
            <option value="Impact, Arial Black, sans-serif">Impact</option>
            <option value="'Arial Black', sans-serif">Arial Black</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="Arial, sans-serif" selected>Arial</option>
            <option value="Verdana, sans-serif">Verdana</option>
          </select>
        </div>
        <div class="full">
          <label>Posición vertical (abajo)</label>
          <input type="range" id="bot-pos" min="50" max="100" value="93">
          <small id="bot-pos-val" style="color:var(--muted)">93%</small>
        </div>
      </div>
    </div>

    <!-- Acciones -->
    <div class="btn-group">
      <button class="btn btn-download" id="btn-download">
        ⬇ Descargar imagen (alta resolución)
      </button>
      <button class="btn btn-reset" id="btn-reset">
        ↺ Reiniciar
      </button>
    </div>

  </div><!-- /sidebar -->

  <!-- ─────────────────── PREVIEW ─────────────────── -->
  <div class="preview-pane">
    <div id="canvas-wrap">
      <canvas id="canvas-preview"></canvas>
    </div>
    <div class="preview-size" id="preview-size">1080 × 1080 px</div>
  </div>

</div><!-- /app -->

<script>
// ── State ───────────────────────────────────────────────────────────────
const S = {
  w: 1080, h: 1080,
  bgType: 'gradient',   // 'gradient' | 'color' | 'image'
  bgGradIndex: 0,
  bgColorVal: '#0b0f1a',
  bgImg: null,
  bgOverlay: 40,
  mainImg: null,
  mainScale: 0.70,
  mainY: 0.50,
  textTop: '',
  textBot: '',
  topSize: 72,
  topColor: '#ffffff',
  topShadow: '#000000',
  topFont: 'Impact, Arial Black, sans-serif',
  topPos: 0.08,
  botSize: 56,
  botColor: '#ffffff',
  botShadow: '#000000',
  botFont: 'Arial, sans-serif',
  botPos: 0.93,
};

// ── Gradient presets ─────────────────────────────────────────────────────
const GRADIENTS = [
  { stops: ['#060b14','#0d1425','#0a0618'], label: 'Noche Azul' },
  { stops: ['#1a0a2e','#6633cc','#0a0618'], label: 'Púrpura' },
  { stops: ['#0a1a0a','#00843d','#001a0a'], label: 'Verde FIFA' },
  { stops: ['#1a0000','#c8102e','#0a0000'], label: 'Rojo Pasión' },
  { stops: ['#0a0a14','#00a9bd','#060b14'], label: 'Cian' },
  { stops: ['#0d0900','#d4af37','#0a0600'], label: 'Dorado' },
  { stops: ['#140a1a','#ec4899','#0d0614'], label: 'Rosa' },
  { stops: ['#0a0c14','#f07800','#0d0a06'], label: 'Naranja' },
];

// ── Canvas ───────────────────────────────────────────────────────────────
const canvasEl = document.getElementById('canvas-preview');
const ctx = canvasEl.getContext('2d');

// We render at full resolution to an offscreen canvas, then scale to preview
let offscreen = null;

function getOffscreen() {
  if (!offscreen || offscreen.width !== S.w || offscreen.height !== S.h) {
    offscreen = document.createElement('canvas');
    offscreen.width = S.w;
    offscreen.height = S.h;
  }
  return offscreen;
}

function render() {
  const oc = getOffscreen();
  const c = oc.getContext('2d');
  c.clearRect(0, 0, S.w, S.h);

  // 1. Background
  drawBg(c);

  // 2. Main image
  if (S.mainImg) drawMainImg(c);

  // 3. Texts
  if (S.textTop.trim()) drawText(c, S.textTop, 'top');
  if (S.textBot.trim()) drawText(c, S.textBot, 'bot');

  // Blit to preview canvas (scaled to fit)
  const maxW = canvasEl.parentElement.parentElement.clientWidth - 48;
  const maxH = window.innerHeight - 120;
  const scale = Math.min(maxW / S.w, maxH / S.h, 1);
  canvasEl.width  = Math.round(S.w * scale);
  canvasEl.height = Math.round(S.h * scale);
  ctx.drawImage(oc, 0, 0, canvasEl.width, canvasEl.height);

  document.getElementById('preview-size').textContent = `${S.w} × ${S.h} px`;
}

function drawBg(c) {
  if (S.bgType === 'gradient') {
    const g = S.gradients[S.bgGradIndex];
    const grad = c.createLinearGradient(0, 0, S.w * 0.4, S.h);
    g.stops.forEach((col, i) => grad.addColorStop(i / (g.stops.length - 1), col));
    c.fillStyle = grad;
    c.fillRect(0, 0, S.w, S.h);
  } else if (S.bgType === 'color') {
    c.fillStyle = S.bgColorVal;
    c.fillRect(0, 0, S.w, S.h);
  } else if (S.bgType === 'image' && S.bgImg) {
    // Cover fit
    const ir = S.bgImg.naturalWidth / S.bgImg.naturalHeight;
    const cr = S.w / S.h;
    let sx = 0, sy = 0, sw = S.bgImg.naturalWidth, sh = S.bgImg.naturalHeight;
    if (ir > cr) {
      sw = S.bgImg.naturalHeight * cr;
      sx = (S.bgImg.naturalWidth - sw) / 2;
    } else {
      sh = S.bgImg.naturalWidth / cr;
      sy = (S.bgImg.naturalHeight - sh) / 2;
    }
    c.drawImage(S.bgImg, sx, sy, sw, sh, 0, 0, S.w, S.h);
    // Overlay
    if (S.bgOverlay > 0) {
      c.fillStyle = `rgba(0,0,0,${S.bgOverlay / 100})`;
      c.fillRect(0, 0, S.w, S.h);
    }
  } else {
    c.fillStyle = '#0b0f1a';
    c.fillRect(0, 0, S.w, S.h);
  }
}

function drawMainImg(c) {
  const img = S.mainImg;
  const maxW = S.w * S.mainScale;
  const maxH = S.h * S.mainScale;
  const ir = img.naturalWidth / img.naturalHeight;
  let dw, dh;
  if (ir >= maxW / maxH) {
    dw = maxW; dh = maxW / ir;
  } else {
    dh = maxH; dw = maxH * ir;
  }
  const dx = (S.w - dw) / 2;
  const dy = S.mainY * (S.h - dh);
  c.drawImage(img, dx, dy, dw, dh);
}

function drawText(c, text, pos) {
  const isTop = pos === 'top';
  const size   = isTop ? S.topSize : S.botSize;
  const color  = isTop ? S.topColor : S.botColor;
  const shadow = isTop ? S.topShadow : S.botShadow;
  const font   = isTop ? S.topFont : S.botFont;
  const yFrac  = isTop ? S.topPos : S.botPos;

  c.save();
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.font = `bold ${size}px ${font}`;
  c.fillStyle = color;
  c.shadowColor = shadow;
  c.shadowBlur = size * 0.3;
  c.shadowOffsetX = 0;
  c.shadowOffsetY = size * 0.04;

  const lines = text.split('\n');
  const lineH = size * 1.2;
  const totalH = lines.length * lineH;
  const startY = yFrac * S.h - totalH / 2 + lineH / 2;
  lines.forEach((line, i) => {
    c.fillText(line, S.w / 2, startY + i * lineH);
  });
  c.restore();
}

// ── Init gradient swatches ────────────────────────────────────────────────
S.gradients = GRADIENTS;

function initSwatches() {
  const container = document.getElementById('bg-presets');

  // Solid color swatch
  const colorSwatch = document.createElement('div');
  colorSwatch.title = 'Color sólido';
  colorSwatch.style.cssText = 'width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent;background:#1a2236;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;transition:border-color .15s,transform .15s';
  colorSwatch.textContent = '🎨';
  const hiddenColor = document.createElement('input');
  hiddenColor.type = 'color';
  hiddenColor.value = S.bgColorVal;
  hiddenColor.style.cssText = 'position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%';
  hiddenColor.addEventListener('input', e => {
    S.bgType = 'color';
    S.bgColorVal = e.target.value;
    document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
    colorSwatch.style.borderColor = '#fff';
    render();
  });
  colorSwatch.appendChild(hiddenColor);
  container.appendChild(colorSwatch);

  GRADIENTS.forEach((g, i) => {
    const sw = document.createElement('div');
    sw.className = 'bg-swatch' + (i === 0 ? ' active' : '');
    sw.title = g.label;
    const grad = `linear-gradient(135deg, ${g.stops.join(', ')})`;
    sw.style.background = grad;
    sw.addEventListener('click', () => {
      document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
      colorSwatch.style.borderColor = 'transparent';
      sw.classList.add('active');
      S.bgType = 'gradient';
      S.bgGradIndex = i;
      render();
    });
    container.appendChild(sw);
  });
}

// ── Wire controls ─────────────────────────────────────────────────────────
function wire() {
  // Format buttons
  document.querySelectorAll('.fmt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      S.w = +btn.dataset.w;
      S.h = +btn.dataset.h;
      render();
    });
  });

  // BG file
  document.getElementById('bg-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('bg-file-name').textContent = file.name;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      S.bgImg = img;
      S.bgType = 'image';
      document.getElementById('overlay-row').style.display = 'flex';
      document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
      render();
    };
    img.src = url;
  });

  // BG overlay
  const bgOverlayInput = document.getElementById('bg-overlay');
  bgOverlayInput.addEventListener('input', () => {
    S.bgOverlay = +bgOverlayInput.value;
    document.getElementById('bg-overlay-val').textContent = S.bgOverlay + '%';
    render();
  });

  // Main image file
  document.getElementById('main-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('main-file-name').textContent = file.name;
    loadMainImg(URL.createObjectURL(file));
  });

  // Main image URL
  document.getElementById('main-url-btn').addEventListener('click', () => {
    const url = document.getElementById('main-url').value.trim();
    if (url) loadMainImg(url);
  });
  document.getElementById('main-url').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('main-url-btn').click();
  });

  // Main scale
  const mainScaleInput = document.getElementById('main-scale');
  mainScaleInput.addEventListener('input', () => {
    S.mainScale = mainScaleInput.value / 100;
    document.getElementById('main-scale-val').textContent = mainScaleInput.value + '%';
    render();
  });

  // Main Y
  const mainYInput = document.getElementById('main-y');
  mainYInput.addEventListener('input', () => {
    S.mainY = mainYInput.value / 100;
    const labels = ['Arriba', 'Centro', 'Abajo'];
    const v = +mainYInput.value;
    document.getElementById('main-y-val').textContent = v < 35 ? 'Arriba' : v > 65 ? 'Abajo' : 'Centro';
    render();
  });

  // Text inputs
  document.getElementById('text-top').addEventListener('input', e => { S.textTop = e.target.value; render(); });
  document.getElementById('text-bottom').addEventListener('input', e => { S.textBot = e.target.value; render(); });

  // Top text controls
  document.getElementById('top-size').addEventListener('input', e => { S.topSize = +e.target.value; document.getElementById('top-size-val').textContent = e.target.value + 'px'; render(); });
  document.getElementById('top-color').addEventListener('input', e => { S.topColor = e.target.value; render(); });
  document.getElementById('top-shadow-color').addEventListener('input', e => { S.topShadow = e.target.value; render(); });
  document.getElementById('top-font').addEventListener('change', e => { S.topFont = e.target.value; render(); });
  document.getElementById('top-pos').addEventListener('input', e => { S.topPos = e.target.value / 100; document.getElementById('top-pos-val').textContent = e.target.value + '%'; render(); });

  // Bottom text controls
  document.getElementById('bot-size').addEventListener('input', e => { S.botSize = +e.target.value; document.getElementById('bot-size-val').textContent = e.target.value + 'px'; render(); });
  document.getElementById('bot-color').addEventListener('input', e => { S.botColor = e.target.value; render(); });
  document.getElementById('bot-shadow-color').addEventListener('input', e => { S.botShadow = e.target.value; render(); });
  document.getElementById('bot-font').addEventListener('change', e => { S.botFont = e.target.value; render(); });
  document.getElementById('bot-pos').addEventListener('input', e => { S.botPos = e.target.value / 100; document.getElementById('bot-pos-val').textContent = e.target.value + '%'; render(); });

  // Download
  document.getElementById('btn-download').addEventListener('click', () => {
    const oc = getOffscreen();
    oc.toBlob(blob => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `marketing-${S.w}x${S.h}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }, 'image/png');
  });

  // Reset
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (!confirm('¿Reiniciar todos los ajustes?')) return;
    S.mainImg = null; S.bgImg = null; S.bgType = 'gradient'; S.bgGradIndex = 0;
    S.textTop = ''; S.textBot = '';
    document.getElementById('text-top').value = '';
    document.getElementById('text-bottom').value = '';
    document.getElementById('main-file-name').textContent = '';
    document.getElementById('bg-file-name').textContent = '';
    document.getElementById('overlay-row').style.display = 'none';
    document.querySelectorAll('.bg-swatch').forEach((s, i) => s.classList.toggle('active', i === 1));
    render();
  });

  // Resize
  window.addEventListener('resize', render);
}

function loadMainImg(src) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { S.mainImg = img; render(); };
  img.onerror = () => alert('No se pudo cargar la imagen. Verifica la URL o sube el archivo directamente.');
  img.src = src;
}

// ── Boot ──────────────────────────────────────────────────────────────────
initSwatches();
wire();
render();
</script>
</body>
</html>
